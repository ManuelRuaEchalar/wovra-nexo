<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dendra · Concepto de fondo: el horizonte de la red</title>
<style>
  /*
   * Concepto A · "El horizonte de la red". Cámara casi a ras de un mar de
   * neuronas de luz granulada que se pierde en un horizonte curvo. La cámara
   * avanza muy despacio; impulsos nacen a lo lejos y viajan de neurona en
   * neurona hacia nosotros. Misma estética que fondo-dendritas-luz.html.
   */
  @font-face { font-family: Sora; src: url(../borradores/assets/sora.ttf); }
  @font-face { font-family: Hanken; src: url(../borradores/assets/hanken_grotesk.ttf); }
  :root { --aurora: #2bd07e; --destello: #9ff0c4; --fondo: #f4f9f6; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #020b0a; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; }
  #suave { filter: blur(1.2px); }
  .vineta { position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(130% 100% at 50% 60%, transparent 40%, #01060580 75%, #010504f0 100%); }
  .grano { position: fixed; inset: -50%; pointer-events: none; opacity: .15; mix-blend-mode: overlay; }
  .texto { position: fixed; left: 50%; top: 13vh; transform: translateX(-50%); text-align: center; color: var(--fondo);
    width: min(760px, 90vw); transition: opacity .6s; }
  .texto.oculto { opacity: 0; }
  .eyebrow { font: 600 12px/1 Hanken, sans-serif; letter-spacing: .18em; text-transform: uppercase; color: var(--destello); margin: 0 0 18px; }
  h1 { font: 300 clamp(56px, 8vw, 120px)/.95 Sora, sans-serif; letter-spacing: -.06em; margin: 0; }
  .lema { font: 400 clamp(17px, 1.6vw, 21px)/1.5 Hanken, sans-serif; color: #c9d6d2; margin: 20px auto 0; max-width: 44ch; }
  .controles { position: fixed; right: 20px; bottom: 18px; display: flex; gap: 8px; }
  .controles button { font: 600 12px Hanken, sans-serif; color: #c9d6d2; background: #0e3b3699;
    border: 1px solid #9ff0c433; border-radius: 99px; padding: 8px 14px; cursor: pointer; backdrop-filter: blur(6px); }
</style>
</head>
<body>
<canvas id="lienzo"></canvas>
<canvas id="suave"></canvas>
<div class="vineta"></div>
<div class="grano" id="grano"></div>
<div class="texto" id="texto">
  <p class="eyebrow">Sucre, Bolivia · Red de pruebas</p>
  <h1>Dendra</h1>
  <p class="lema">Miles de celulares que se pasan la señal. Siempre hay un camino de vuelta a ti.</p>
</div>
<div class="controles">
  <button id="btnTexto">Ocultar texto</button>
  <button id="btnPausa">Pausar</button>
</div>

<script>
// ---------------------------------------------------------------------------
// Utilidades y estética compartida con fondo-dendritas-luz.html
// ---------------------------------------------------------------------------
function semilla(a) {
  return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
const lerp = (a, b, t) => a + (b - a) * t;
const gauss = (r) => (r() + r() + r() + r() - 2) / 1.15;
const reducido = matchMedia('(prefers-reduced-motion: reduce)').matches;
const DPR = Math.min(devicePixelRatio || 1, 1.5);
const AURORA = '43,208,126', DESTELLO = '159,240,196', BLANCO = '232,255,243';
const $ = (id) => document.getElementById(id);

function crecer(r, x, y, ang, w, largo, prof, ramas, opts = {}) {
  const paso = 4, pts = [{ x, y, w }];
  let a = ang;
  const n = Math.floor(largo / paso), curva = (r() - .5) * .025;
  for (let i = 0; i < n; i++) {
    if (opts.subir) a += (opts.subir - a) * .02;
    a += (r() - .5) * .36 + curva;
    x += Math.cos(a) * paso; y += Math.sin(a) * paso;
    w = Math.max(w * (opts.afinar ?? .978), .5);
    pts.push({ x, y, w });
    if (prof > 0 && i > 4 && w > .8 && r() < (opts.dividir ?? .07)) {
      const lado = r() < .5 ? -1 : 1;
      crecer(r, x, y, a + lado * (.5 + r() * .6), w * (.5 + r() * .2), largo * (.3 + r() * .35), prof - 1, ramas);
      a -= lado * (.1 + r() * .15);
    }
  }
  ramas.push(pts);
}

function piramidal(r, cx, cy, tam, inclin) {
  const ramas = [], arriba = -Math.PI / 2 + inclin;
  crecer(r, cx + Math.cos(arriba) * tam, cy + Math.sin(arriba) * tam, arriba, tam * .45, tam * 14, 6, ramas,
    { subir: arriba, afinar: .99, dividir: .075 });
  const nb = 5 + Math.floor(r() * 3);
  for (let i = 0; i < nb; i++) {
    const a = arriba + Math.PI + (i / (nb - 1) - .5) * 2.6 + (r() - .5) * .3;
    crecer(r, cx + Math.cos(a) * tam * .7, cy + Math.sin(a) * tam * .7, a, tam * (.24 + r() * .12), tam * (6 + r() * 5), 5, ramas);
  }
  return { cx, cy, tam, arriba, ramas };
}

/** Neurona de luz granulada (mismo método que el concepto aprobado). */
function pintarNeurona(ctx, n, r, brillo = 1) {
  const W = ctx.canvas.width, H = ctx.canvas.height, m = ctx.getTransform();
  const tmp = document.createElement('canvas'); tmp.width = W; tmp.height = H;
  const t = tmp.getContext('2d'); t.setTransform(m);
  t.lineCap = 'round'; t.strokeStyle = `rgb(${AURORA})`;
  for (const pts of n.ramas) for (let i = 1; i < pts.length; i++) {
    t.lineWidth = pts[i].w * 2.6; t.beginPath(); t.moveTo(pts[i - 1].x, pts[i - 1].y); t.lineTo(pts[i].x, pts[i].y); t.stroke();
  }
  t.fillStyle = `rgb(${AURORA})`; t.beginPath(); t.arc(n.cx, n.cy, n.tam * 1.3, 0, Math.PI * 2); t.fill();
  ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalCompositeOperation = 'lighter';
  ctx.filter = 'blur(12px)'; ctx.globalAlpha = .12 * brillo; ctx.drawImage(tmp, 0, 0);
  ctx.filter = 'blur(3px)'; ctx.globalAlpha = .14 * brillo; ctx.drawImage(tmp, 0, 0);
  ctx.restore();
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  const grano = (x, y, rad, color, alfa) => { ctx.fillStyle = `rgba(${color},${alfa})`; ctx.beginPath(); ctx.arc(x, y, rad, 0, Math.PI * 2); ctx.fill(); };
  for (const pts of n.ramas) for (let i = 1; i < pts.length; i++) {
    const a = pts[i - 1], b = pts[i], ang = Math.atan2(b.y - a.y, b.x - a.x) + Math.PI / 2;
    const densidad = Math.min(14, 2.2 + b.w * 2.4);
    for (let k = 0; k < densidad; k++) {
      const f = r(), d = gauss(r) * b.w * .7;
      const centro = 1 - Math.min(1, Math.abs(d) / (b.w * .9 + .5));
      const color = r() < .18 + centro * .3 ? BLANCO : r() < .55 ? DESTELLO : AURORA;
      grano(lerp(a.x, b.x, f) + Math.cos(ang) * d, lerp(a.y, b.y, f) + Math.sin(ang) * d, .4 + r() * .8, color, (.1 + .34 * centro * r()) * brillo);
    }
    if (b.w < 3 && r() < .28) {
      const s = r() < .5 ? -1 : 1, l = 1.5 + r() * 4;
      for (let k = 0; k < 4; k++) grano(b.x + Math.cos(ang) * s * k / 3 * l, b.y + Math.sin(ang) * s * k / 3 * l, .35 + r() * .4, DESTELLO, .15 * brillo);
    }
  }
  for (let k = 0; k < 900; k++) {
    const ang = r() * Math.PI * 2, rad = Math.abs(gauss(r)) * n.tam * .75, tri = 1 + .3 * Math.cos(3 * (ang - n.arriba));
    const centro = 1 - Math.min(1, rad / n.tam);
    grano(n.cx + Math.cos(ang) * rad * tri, n.cy + Math.sin(ang) * rad * tri * .92, .4 + r() * .8, centro > .55 ? BLANCO : DESTELLO, (.06 + .22 * centro) * brillo);
  }
  ctx.restore();
}

// ---------------------------------------------------------------------------
// Sprites: neuronas pre-pintadas, en versión nítida y desenfocada
// ---------------------------------------------------------------------------
const TAM_SPRITE = 420;
const sprites = [];
function crearSprites() {
  for (let i = 0; i < 7; i++) {
    const r = semilla(300 + i);
    const c = document.createElement('canvas'); c.width = c.height = TAM_SPRITE;
    const ctx = c.getContext('2d');
    pintarNeurona(ctx, piramidal(r, TAM_SPRITE / 2, TAM_SPRITE * .58, 11 + r() * 5, (r() - .5) * .8), r, 1);
    const borrosa = document.createElement('canvas'); borrosa.width = borrosa.height = TAM_SPRITE;
    const b = borrosa.getContext('2d'); b.filter = 'blur(9px)'; b.drawImage(c, 0, 0); b.drawImage(c, 0, 0);
    sprites.push({ nitida: c, borrosa });
  }
}

// ---------------------------------------------------------------------------
// Tejido: fibras granuladas en una textura que se repite (se dibuja en perspectiva)
// ---------------------------------------------------------------------------
const TEJ = 1024;
let tejido = null;
function crearTejido() {
  const base = document.createElement('canvas'); base.width = base.height = TEJ;
  const ctx = base.getContext('2d');
  const r = semilla(808), ramas = [];
  for (let i = 0; i < 120; i++) {
    crecer(r, r() * TEJ, r() * TEJ, r() * Math.PI * 2, .8 + r() * 1.2, 200 + r() * 700, 2, ramas, { afinar: .996, dividir: .03 });
  }
  // Se pinta nueve veces desplazado para que la textura empalme sin costuras.
  for (const dx of [-TEJ, 0, TEJ]) for (const dy of [-TEJ, 0, TEJ]) {
    ctx.save(); ctx.translate(dx, dy);
    pintarNeurona(ctx, { ramas, cx: -999, cy: -999, tam: 0, arriba: 0 }, semilla(9), .55);
    ctx.restore();
  }
  // Tres copias en horizontal: alcanza para cubrir el ancho visible.
  tejido = document.createElement('canvas'); tejido.width = TEJ * 3; tejido.height = TEJ;
  const t = tejido.getContext('2d'); for (let i = 0; i < 3; i++) t.drawImage(base, i * TEJ, 0);
}
const ESC_X = 230, ESC_Z = 150; // píxeles de textura por unidad de mundo

const suelo = document.createElement('canvas');
/**
 * Dibuja el tejido en perspectiva por franjas. Cada franja toma de la textura
 * la altura que le corresponde (no una sola línea), y el resultado se
 * suaviza: así no aparecen rayas horizontales.
 */
function pintarTejido(ctx) {
  if (suelo.width !== Math.round(W) || suelo.height !== Math.round(H)) { suelo.width = W; suelo.height = H; }
  const s = suelo.getContext('2d');
  s.globalCompositeOperation = 'source-over'; s.clearRect(0, 0, W, H);
  s.globalCompositeOperation = 'lighter';
  const zEn = (sy) => (.9 * k * .55) / (sy - horizonte);
  for (let sy = Math.ceil(horizonte + 2); sy < H; sy += 2) {
    const z = zEn(sy);
    if (z > 9) continue;
    const ancho = W * z / k;
    const alto = Math.max(1, Math.min(60, (z - zEn(sy + 2)) * ESC_Z));
    let v = ((((z + camZ) * ESC_Z) % TEJ) + TEJ) % TEJ;
    if (v + alto > TEJ) v = TEJ - alto;
    const u0 = TEJ * 1.5 - ancho * ESC_X / 2;
    if (u0 < 0) continue;
    s.globalAlpha = Math.min(1, Math.max(0, (9 - z) / 6)) * Math.min(1, z / .9) * .8;
    s.drawImage(tejido, u0, v, ancho * ESC_X, alto, 0, sy, W, 2.6);
  }
  ctx.save(); ctx.filter = 'blur(1.1px)'; ctx.drawImage(suelo, 0, 0, W, H); ctx.restore();
}

// ---------------------------------------------------------------------------
// Mundo: un plano de neuronas que se pierde en el horizonte
// ---------------------------------------------------------------------------
const Z_CERCA = .55, Z_LEJOS = 14, ANCHO = 9;
const r = semilla(77);
const neuronas = Array.from({ length: 420 }, () => ({
  x: (r() * 2 - 1) * ANCHO, z: Z_CERCA + r() * (Z_LEJOS - Z_CERCA),
  s: r() * 7 | 0, tam: 1 + r() * .9, giro: (r() - .5) * .5, fase: r() * 6.28,
}));
let camZ = 0; // cuánto avanzó la cámara

const lienzo = $('lienzo'), suave = $('suave');
let W, H, cx, horizonte, k;
function medir() {
  W = innerWidth; H = innerHeight;
  for (const c of [lienzo, suave]) { c.width = W * DPR; c.height = H * DPR; }
  cx = W / 2; horizonte = H * .56; k = Math.min(W, H * 1.8) * .55;
}

/** Proyección con perspectiva y una leve curvatura de planeta. */
function proyectar(x, z) {
  const f = 1 / z, sx = cx + x * f * k;
  const curva = Math.pow((sx - cx) / (W * .7), 2) * H * .13; // el horizonte se curva hacia abajo en los lados
  return { x: sx, y: horizonte + .9 * f * k * .55 + curva * Math.min(1, 3 / z), f };
}

// Impulsos: caminos de neuronas de lejos hacia cerca.
const impulsos = [];
function nuevoImpulso() {
  let actual = neuronas.filter(n => relZ(n) > 8 && relZ(n) < 12 && Math.abs(n.x) < 4)
    .sort(() => Math.random() - .5)[0];
  if (!actual) return;
  const camino = [actual];
  while (relZ(actual) > 1.2 && camino.length < 14) {
    const sig = neuronas.filter(n => relZ(n) < relZ(actual) - .3 && relZ(n) > Math.max(1.3, relZ(actual) - 2) && Math.abs(n.x - actual.x) < 1.8)
      .sort((a, b) => Math.abs(a.x - actual.x) - Math.abs(b.x - actual.x))[Math.floor(Math.random() * 2)];
    if (!sig) break;
    camino.push(sig); actual = sig;
  }
  if (camino.length > 3) impulsos.push({ camino, zs: camino.map(n => n.z), nacio: tiempo, vel: 1.1 + Math.random() * .5 });
}
const relZ = (n) => n.z;

function chispas(ctx, x, y, disp, n, alfa) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * 6.283, d = Math.abs(Math.random() + Math.random() - 1) * disp;
    ctx.fillStyle = `rgba(${Math.random() < .5 ? BLANCO : DESTELLO},${alfa * Math.random()})`;
    ctx.beginPath(); ctx.arc(x + Math.cos(a) * d, y + Math.sin(a) * d, .4 + Math.random() * .9, 0, 6.283); ctx.fill();
  }
}
function luz(ctx, x, y, rad, color, alfa) {
  const g = ctx.createRadialGradient(x, y, 0, x, y, rad);
  g.addColorStop(0, `rgba(${color},${alfa})`); g.addColorStop(1, `rgba(${color},0)`);
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, rad, 0, 6.283); ctx.fill();
}

// ---------------------------------------------------------------------------
// Cuadro
// ---------------------------------------------------------------------------
let tiempo = 0, previo = performance.now(), pausa = false, proximo = .5;
const polvo = Array.from({ length: 60 }, () => ({ x: Math.random(), y: Math.random(), vx: 0, vy: 0, rad: 1 + Math.random() * 3 }));

function cuadro(ahora) {
  const dt = pausa ? 0 : Math.min(.05, (ahora - previo) / 1000); previo = ahora; tiempo += dt;
  const ctx = lienzo.getContext('2d'), cs = suave.getContext('2d');
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0); cs.setTransform(DPR, 0, 0, DPR, 0, 0);

  // Cielo y horizonte de luz.
  const cielo = ctx.createLinearGradient(0, 0, 0, H);
  cielo.addColorStop(0, '#020a09'); cielo.addColorStop(.42, '#05201c'); cielo.addColorStop(.56, '#0c3a33');
  cielo.addColorStop(.62, '#082a25'); cielo.addColorStop(1, '#03110f');
  ctx.globalCompositeOperation = 'source-over'; ctx.fillStyle = cielo; ctx.fillRect(0, 0, W, H);
  ctx.globalCompositeOperation = 'lighter';
  // Franja del horizonte: un arco suave de luz Aurora.
  for (let i = 0; i < 3; i++) {
    ctx.strokeStyle = `rgba(${i ? AURORA : DESTELLO},${[.05, .035, .02][i]})`;
    ctx.lineWidth = [10, 40, 120][i];
    ctx.filter = `blur(${[4, 14, 40][i]}px)`;
    ctx.beginPath();
    for (let x = -50; x <= W + 50; x += 20) { const p = proyectar(((x - cx) / k) * 40, 40); x === -50 ? ctx.moveTo(x, p.y) : ctx.lineTo(x, p.y); }
    ctx.stroke();
  }
  ctx.filter = 'none';

  // Tejido continuo del suelo.
  pintarTejido(ctx);

  // Avance de la cámara: las neuronas se acercan; las que pasan vuelven al fondo.
  if (!reducido) camZ += dt * .16;
  if (!reducido) for (const n of neuronas) {
    n.z -= dt * .16;
    if (n.z < Z_CERCA) { n.z += Z_LEJOS - Z_CERCA; n.x = (Math.random() * 2 - 1) * ANCHO; }
  }

  // Neuronas de lejos a cerca. Bruma con la distancia, desenfoque fuera del plano medio.
  cs.clearRect(0, 0, W, H);
  cs.globalCompositeOperation = 'lighter';
  const orden = neuronas.slice().sort((a, b) => b.z - a.z);
  for (const n of orden) {
    const p = proyectar(n.x, n.z);
    const lado = TAM_SPRITE * p.f * n.tam * k / 900;
    if (lado < 3 || p.x < -lado || p.x > W + lado) continue;
    const niebla = Math.min(1, Math.max(0, 1 - (n.z - 3) / (Z_LEJOS - 3)));      // se apaga hacia el horizonte
    const entrada = Math.min(1, (Z_LEJOS - n.z) / 1.5);                             // aparece sin saltos
    const salida = Math.min(1, (n.z - Z_CERCA) / .5);
    const alfa = (.35 + .65 * niebla) * entrada * salida * (.85 + .15 * Math.sin(tiempo * .7 + n.fase));
    const desenfocada = n.z < 1.6 || n.z > 6;
    const destino = n.z < 1.6 ? cs : ctx;   // las muy cercanas van a la capa suave
    destino.save();
    destino.globalAlpha = alfa;
    destino.translate(p.x, p.y);
    destino.rotate(n.giro);
    destino.scale(1, .62);                  // escorzo: el plano se ve en perspectiva
    destino.drawImage(desenfocada ? sprites[n.s].borrosa : sprites[n.s].nitida, -lado / 2, -lado * .58, lado, lado);
    destino.restore();
  }

  // Impulsos que viajan desde el horizonte hacia la cámara.
  proximo -= dt;
  if (proximo <= 0 && !pausa) { nuevoImpulso(); proximo = 1.6 + Math.random() * 2.4; }
  for (let i = impulsos.length - 1; i >= 0; i--) {
    const im = impulsos[i], avance = (tiempo - im.nacio) * im.vel;
    // Si una neurona del camino ya pasó junto a la cámara y volvió al fondo, el impulso termina.
    if (im.camino.some((n, j) => n.z > im.zs[j] + .5)) { impulsos.splice(i, 1); continue; }
    const tramo = Math.floor(avance);
    if (tramo >= im.camino.length - 1) {
      const u = im.camino[im.camino.length - 1], p = proyectar(u.x, u.z), fin = avance - tramo;
      luz(ctx, p.x, p.y, 70 * p.f, DESTELLO, .35 * (1 - fin)); chispas(ctx, p.x, p.y, 40 * p.f, 30, .8 * (1 - fin));
      if (avance > im.camino.length) impulsos.splice(i, 1);
      continue;
    }
    const a = im.camino[tramo], b = im.camino[tramo + 1], f = avance - tramo;
    const pa = proyectar(a.x, a.z), pb = proyectar(b.x, b.z);
    // Estela granulada por el tramo recorrido (con una curva leve, como una dendrita).
    const mx = (pa.x + pb.x) / 2 + (pb.y - pa.y) * .25, my = (pa.y + pb.y) / 2 - (pb.x - pa.x) * .1;
    const punto = (u) => ({ x: (1 - u) ** 2 * pa.x + 2 * (1 - u) * u * mx + u * u * pb.x, y: (1 - u) ** 2 * pa.y + 2 * (1 - u) * u * my + u * u * pb.y });
    for (let u = 0; u <= f; u += .03) { const q = punto(u); chispas(ctx, q.x, q.y, 2 + 5 * pb.f, 4, .8 * (u / f)); }
    const q = punto(f), tam = lerp(pa.f, pb.f, f);
    luz(ctx, q.x, q.y, 110 * tam + 34, AURORA, .55); luz(ctx, q.x, q.y, 24 * tam + 7, BLANCO, .75);
    chispas(ctx, q.x, q.y, 16 * tam + 8, 40, 1);
    // La neurona que acaba de pasar la señal queda encendida un instante.
    luz(ctx, pa.x, pa.y, 90 * pa.f + 26, DESTELLO, .45 * (1 - f));
  }

  // Polvo en suspensión con movimiento browniano.
  for (const p of polvo) {
    if (!pausa && !reducido) {
      p.vx = p.vx * .92 + (Math.random() - .5) * .0004; p.vy = p.vy * .92 + (Math.random() - .5) * .0004 - .00004;
      p.x = (p.x + p.vx + 1) % 1; p.y = (p.y + p.vy + 1) % 1;
    }
    luz(cs, p.x * W, p.y * H, p.rad * 3, DESTELLO, .1);
  }

  $('grano').style.transform = `translate(${(Math.random() * 100 - 50) | 0}px,${(Math.random() * 100 - 50) | 0}px)`;
  requestAnimationFrame(cuadro);
}

(() => {
  const c = document.createElement('canvas'); c.width = c.height = 220;
  const x = c.getContext('2d'), img = x.createImageData(220, 220);
  for (let i = 0; i < img.data.length; i += 4) { const v = Math.random() * 255;
    img.data[i] = img.data[i + 1] = img.data[i + 2] = v; img.data[i + 3] = 255; }
  x.putImageData(img, 0, 0); $('grano').style.backgroundImage = `url(${c.toDataURL()})`;
})();

$('btnTexto').onclick = (e) => {
  const o = $('texto').classList.toggle('oculto'); e.target.textContent = o ? 'Mostrar texto' : 'Ocultar texto';
};
