<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dendra · Concepto de fondo: dendritas de luz</title>
<style>
  /*
   * Concepto: neuronas hechas de luz granulada (no de materia) sobre la noche
   * verde de la marca. Cada rama es una nube de granos luminosos con un
   * resplandor difuso, como fotones en una exposición larga. Se mantiene la
   * naturalidad del microscopio: iluminación despareja, polvo, foco que cambia
   * y partículas con movimiento browniano. Paleta Halo + Nocturno.
   */
  @font-face { font-family: Sora; src: url(../borradores/assets/sora.ttf); }
  @font-face { font-family: Hanken; src: url(../borradores/assets/hanken_grotesk.ttf); }
  :root { --noche: #0e3b36; --aurora: #2bd07e; --destello: #9ff0c4; --fondo: #f4f9f6; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #03100e; }
  .escena { position: fixed; inset: 0; overflow: hidden; }
  #luzFondo { position: absolute; inset: -4%; width: 108%; height: 108%; }
  .capa { position: absolute; inset: -6%; mix-blend-mode: screen; will-change: transform, filter; }
  .capa canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .vineta { position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(125% 100% at 54% 46%, transparent 38%, #02090880 72%, #010605f0 100%); }
  .grano { position: absolute; inset: -50%; pointer-events: none; opacity: .16; mix-blend-mode: overlay; }

  .texto { position: fixed; left: 7vw; bottom: 12vh; max-width: 640px; color: var(--fondo); transition: opacity .6s; }
  .texto::before { content: ''; position: absolute; z-index: -1; inset: -45% -35% -45% -45%;
    background: radial-gradient(closest-side, #020a09c0, transparent); }
  .texto.oculto { opacity: 0; }
  .eyebrow { font: 600 12px/1 Hanken, sans-serif; letter-spacing: .18em; text-transform: uppercase; color: var(--destello); margin: 0 0 18px; }
  h1 { font: 300 clamp(56px, 8vw, 120px)/.95 Sora, sans-serif; letter-spacing: -.06em; margin: 0; }
  .lema { font: 400 clamp(17px, 1.6vw, 21px)/1.5 Hanken, sans-serif; color: #c9d6d2; margin: 22px 0 0; max-width: 46ch; }
  .controles { position: fixed; right: 20px; bottom: 18px; display: flex; gap: 8px; }
  .controles button { font: 600 12px Hanken, sans-serif; color: #c9d6d2; background: #0e3b3699;
    border: 1px solid #9ff0c433; border-radius: 99px; padding: 8px 14px; cursor: pointer; backdrop-filter: blur(6px); }
  .controles button:hover { color: #fff; border-color: #9ff0c488; }
</style>
</head>
<body>
<div class="escena">
  <canvas id="luzFondo"></canvas>
  <div class="capa" id="lejos"><canvas id="cLejos"></canvas></div>
  <div class="capa" id="medio"><canvas id="cMedio"></canvas></div>
  <div class="capa" id="fxCapa"><canvas id="fx"></canvas></div>
  <div class="capa" id="cerca"><canvas id="cCerca"></canvas></div>
  <div class="vineta"></div>
  <div class="grano" id="grano"></div>
</div>

<div class="texto" id="texto">
  <p class="eyebrow">Sucre, Bolivia · Red de pruebas</p>
  <h1>Dendra</h1>
  <p class="lema">Como las dendritas de una neurona, cada celular recibe la señal del otro. Ninguno está solo.</p>
</div>
<div class="controles">
  <button id="btnTexto">Ocultar texto</button>
  <button id="btnPausa">Pausar</button>
</div>

<script>
// ---------------------------------------------------------------------------
// Utilidades
// ---------------------------------------------------------------------------
function semilla(a) {
  return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
const lerp = (a, b, t) => a + (b - a) * t;
const reducido = matchMedia('(prefers-reduced-motion: reduce)').matches;
const DPR = Math.min(devicePixelRatio || 1, 1.5);
const VW = 1600, VH = 900;
/** Normal aproximada (suma de uniformes): los granos se agrupan cerca del eje de la rama. */
const gauss = (r) => (r() + r() + r() + r() - 2) / 1.15;

// Colores de la marca (Halo + Nocturno).
const AURORA = '43,208,126', DESTELLO = '159,240,196', BLANCO = '232,255,243';

// ---------------------------------------------------------------------------
// Morfología: neuronas piramidales y neuropilo
// ---------------------------------------------------------------------------
function crecer(r, x, y, ang, w, largo, prof, ramas, opts = {}) {
  const paso = 4, pts = [{ x, y, w }];
  let a = ang;
  const n = Math.floor(largo / paso), curva = (r() - .5) * .025;
  for (let i = 0; i < n; i++) {
    let ruidoA = .36;
    if (opts.hacia) {
      const dist = Math.hypot(opts.hacia.x - x, opts.hacia.y - y), cerca = 1 - Math.min(1, dist / 220);
      ruidoA *= .3 + .7 * (1 - cerca);
      let dif = Math.atan2(opts.hacia.y - y, opts.hacia.x - x) - a;
      while (dif > Math.PI) dif -= 2 * Math.PI; while (dif < -Math.PI) dif += 2 * Math.PI;
      a += dif * ((opts.fuerza ?? .05) + cerca * .45);
    }
    if (opts.subir) a += (opts.subir - a) * .02;
    a += (r() - .5) * ruidoA + curva;
    x += Math.cos(a) * paso; y += Math.sin(a) * paso;
    w = Math.max(w * (opts.afinar ?? .978), .5);
    pts.push({ x, y, w });
    if (opts.hacia && Math.hypot(opts.hacia.x - x, opts.hacia.y - y) < 8) break;
    if (prof > 0 && i > 4 && w > .8 && r() < (opts.dividir ?? .07)) {
      const lado = r() < .5 ? -1 : 1;
      crecer(r, x, y, a + lado * (.5 + r() * .6), w * (.5 + r() * .2), largo * (.3 + r() * .35), prof - 1, ramas);
      a -= lado * (.1 + r() * .15);
    }
  }
  ramas.push(pts);
  return pts;
}

function piramidal(r, cx, cy, tam, inclin, opts = {}) {
  const ramas = [], arriba = -Math.PI / 2 + inclin;
  crecer(r, cx + Math.cos(arriba) * tam, cy + Math.sin(arriba) * tam, arriba, tam * .45, tam * 17, 6, ramas,
    { subir: arriba, afinar: .99, dividir: .075 });
  const nb = 5 + Math.floor(r() * 3);
  for (let i = 0; i < nb; i++) {
    const a = arriba + Math.PI + (i / (nb - 1) - .5) * 2.6 + (r() - .5) * .3;
    crecer(r, cx + Math.cos(a) * tam * .7, cy + Math.sin(a) * tam * .7, a, tam * (.24 + r() * .12), tam * (6 + r() * 5), 5, ramas);
  }
  let camino = null;
  if (opts.hacia) {
    const a = Math.atan2(opts.hacia.y - cy, opts.hacia.x - cx);
    camino = crecer(r, cx + Math.cos(a) * tam * .7, cy + Math.sin(a) * tam * .7, a, tam * .17, 1500, 0, ramas,
      { hacia: opts.hacia, afinar: .997 });
  }
  return { cx, cy, tam, arriba, ramas, camino };
}

function neuropilo(r, n, largoMin, largoMax, grosor) {
  const ramas = [];
  for (let i = 0; i < n; i++) {
    crecer(r, r() * VW, r() * VH, r() * Math.PI * 2, grosor * (.6 + r() * .8), largoMin + r() * (largoMax - largoMin), 1, ramas,
      { afinar: .997, dividir: .015 });
  }
  return { ramas, sinSoma: true };
}

// ---------------------------------------------------------------------------
// Dibujo con luz granulada
// ---------------------------------------------------------------------------
/**
 * Una neurona de luz: primero un resplandor muy difuso (el trazo, desenfocado
 * con un filtro), después miles de granos luminosos repartidos alrededor del
 * eje de cada rama. Nada tiene borde ni volumen: es luz que se acumula.
 */
function pintarNeurona(ctx, n, r, brillo = 1) {
  const W = ctx.canvas.width, H = ctx.canvas.height, m = ctx.getTransform();

  // 1. Resplandor difuso.
  const tmp = document.createElement('canvas'); tmp.width = W; tmp.height = H;
  const t = tmp.getContext('2d'); t.setTransform(m);
  t.lineCap = 'round'; t.lineJoin = 'round'; t.strokeStyle = `rgb(${AURORA})`;
  for (const pts of n.ramas) for (let i = 1; i < pts.length; i++) {
    t.lineWidth = pts[i].w * 2.6;
    t.beginPath(); t.moveTo(pts[i - 1].x, pts[i - 1].y); t.lineTo(pts[i].x, pts[i].y); t.stroke();
  }
  if (!n.sinSoma) { t.fillStyle = `rgb(${AURORA})`; t.beginPath(); t.arc(n.cx, n.cy, n.tam * 1.3, 0, Math.PI * 2); t.fill(); }
  ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalCompositeOperation = 'lighter';
  ctx.filter = `blur(${14 * DPR}px)`; ctx.globalAlpha = .11 * brillo; ctx.drawImage(tmp, 0, 0);
  ctx.filter = `blur(${4 * DPR}px)`; ctx.globalAlpha = .14 * brillo; ctx.drawImage(tmp, 0, 0);
  ctx.restore();

  // 2. Granos de luz.
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  const grano = (x, y, rad, color, alfa) => {
    ctx.fillStyle = `rgba(${color},${alfa})`;
    ctx.beginPath(); ctx.arc(x, y, rad, 0, Math.PI * 2); ctx.fill();
  };
  for (const pts of n.ramas) {
    for (let i = 1; i < pts.length; i++) {
      const a = pts[i - 1], b = pts[i];
      const ang = Math.atan2(b.y - a.y, b.x - a.x) + Math.PI / 2;
      const densidad = Math.min(14, 2.2 + b.w * 2.4);   // más granos donde la rama es gruesa
      for (let k = 0; k < densidad; k++) {
        const f = r(), d = gauss(r) * b.w * .7;
        const x = lerp(a.x, b.x, f) + Math.cos(ang) * d, y = lerp(a.y, b.y, f) + Math.sin(ang) * d;
        const centro = 1 - Math.min(1, Math.abs(d) / (b.w * .9 + .5));  // más brillante en el eje
        const color = r() < .18 + centro * .3 ? BLANCO : r() < .55 ? DESTELLO : AURORA;
        grano(x, y, .35 + r() * .75, color, (.08 + .32 * centro * r()) * brillo);
      }
      // Granos sueltos alrededor: la luz se dispersa.
      if (r() < .5) grano(lerp(a.x, b.x, r()) + gauss(r) * (b.w * 2 + 4), lerp(a.y, b.y, r()) + gauss(r) * (b.w * 2 + 4),
        .3 + r() * .5, DESTELLO, .06 * brillo);
      // Espinas: brotes de pocos granos.
      if (b.w < 3 && r() < .28) {
        const s = (r() < .5 ? -1 : 1), l = 1.5 + r() * 4;
        for (let k = 0; k < 4; k++) {
          const q = k / 3 * l;
          grano(b.x + Math.cos(ang) * s * q + gauss(r) * .4, b.y + Math.sin(ang) * s * q + gauss(r) * .4,
            .3 + r() * .4, DESTELLO, (.12 + .12 * (k === 3)) * brillo);
        }
      }
    }
  }
  // Soma: nube densa de granos, más luminosa al centro.
  if (!n.sinSoma) {
    for (let k = 0; k < 900; k++) {
      const ang = r() * Math.PI * 2, rad = Math.abs(gauss(r)) * n.tam * .75;
      const tri = 1 + .3 * Math.cos(3 * (ang - n.arriba));
      const x = n.cx + Math.cos(ang) * rad * tri, y = n.cy + Math.sin(ang) * rad * tri * .92;
      const centro = 1 - Math.min(1, rad / n.tam);
      grano(x, y, .4 + r() * .8, centro > .55 ? BLANCO : DESTELLO, (.06 + .22 * centro) * brillo);
    }
  }
  ctx.restore();
}

// ---------------------------------------------------------------------------
// Fondo: la noche verde con iluminación despareja y polvo
// ---------------------------------------------------------------------------
function pintarFondo(canvas, r) {
  const ctx = canvas.getContext('2d'), W = canvas.width, H = canvas.height;
  const g = ctx.createRadialGradient(W * .55, H * .44, 0, W * .55, H * .44, Math.max(W, H) * .78);
  g.addColorStop(0, '#0f3a34'); g.addColorStop(.5, '#09241f'); g.addColorStop(1, '#030e0c');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  ctx.globalCompositeOperation = 'screen';
  for (let i = 0; i < 70; i++) { // nubes suaves de luz
    const x = r() * W, y = r() * H, rad = (60 + r() * 300) * DPR;
    const m = ctx.createRadialGradient(x, y, 0, x, y, rad);
    m.addColorStop(0, `rgba(${AURORA},${.012 + r() * .025})`); m.addColorStop(1, `rgba(${AURORA},0)`);
    ctx.fillStyle = m; ctx.fillRect(x - rad, y - rad, rad * 2, rad * 2);
  }
  for (let i = 0; i < 700; i++) { // polvo luminoso fino
    ctx.fillStyle = `rgba(${DESTELLO},${.02 + r() * .07})`;
    ctx.beginPath(); ctx.arc(r() * W, r() * H, (.3 + r() * 1) * DPR, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalCompositeOperation = 'source-over';
}

// ---------------------------------------------------------------------------
// Escena
// ---------------------------------------------------------------------------
const $ = (id) => document.getElementById(id);
const lienzos = { fondo: $('luzFondo'), lejos: $('cLejos'), medio: $('cMedio'), fx: $('fx'), cerca: $('cCerca') };
let escala = 1, ox = 0, oy = 0, escena = null;
const aplicar = (ctx) => ctx.setTransform(DPR * escala, 0, 0, DPR * escala, DPR * ox, DPR * oy);
function limpiar(c) { const x = c.getContext('2d'); x.setTransform(1, 0, 0, 1, 0, 0); x.clearRect(0, 0, c.width, c.height); return x; }

function preparar() {
  const box = $('medio').getBoundingClientRect();
  for (const c of Object.values(lienzos)) {
    const b = c.getBoundingClientRect(); c.width = Math.round(b.width * DPR); c.height = Math.round(b.height * DPR);
  }
  escala = Math.max(box.width / VW, box.height / VH);
  ox = (box.width - VW * escala) / 2; oy = (box.height - VH * escala) / 2;

  const r = semilla(2026), sinapsis = { x: 930, y: 420 };
  const A = piramidal(r, 540, 720, 24, .3, { hacia: { x: sinapsis.x - 6, y: sinapsis.y + 4 } });
  const B = piramidal(r, 1250, 470, 21, -.2, { hacia: { x: sinapsis.x + 6, y: sinapsis.y - 3 } });
  const lejanas = [
    piramidal(r, 200, 420, 18, -.2), piramidal(r, 1460, 860, 19, .3), piramidal(r, 820, 200, 15, .1),
    piramidal(r, 1080, 820, 16, -.4), piramidal(r, 420, 120, 14, .25), piramidal(r, 1500, 220, 16, -.1),
    piramidal(r, 700, 520, 13, .5), piramidal(r, 60, 820, 17, .1), neuropilo(r, 70, 250, 900, 1.1),
  ];
  const fibras = neuropilo(semilla(404), 26, 200, 700, .8);
  const cercanas = [piramidal(semilla(91), 150, 980, 30, .6)];
  const particulas = Array.from({ length: 50 }, () => ({ x: r() * VW, y: r() * VH, rad: 1.2 + r() * 4, vx: 0, vy: 0, prof: r() }));
  escena = { A, B, caminoB: B.camino.slice().reverse(), sinapsis, lejanas, fibras, cercanas, particulas };

  pintarFondo(lienzos.fondo, semilla(5));
  let ctx = limpiar(lienzos.lejos); aplicar(ctx);
  lejanas.forEach((n, i) => pintarNeurona(ctx, n, semilla(30 + i), n.sinSoma ? .28 : .42));
  ctx = limpiar(lienzos.medio); aplicar(ctx);
  pintarNeurona(ctx, fibras, semilla(9), .5);
  [A, B].forEach((n, i) => pintarNeurona(ctx, n, semilla(10 + i), 1));
  ctx = limpiar(lienzos.cerca); aplicar(ctx);
  cercanas.forEach((n, i) => pintarNeurona(ctx, n, semilla(50 + i), .8));
}

// ---------------------------------------------------------------------------
// Animación
// ---------------------------------------------------------------------------
const CICLO = 11, T_A = 4.2, T_SALTO = .9, T_B = 3.4;
let t0 = performance.now(), pausa = false, tPausa = 0, previo = 0;

function puntoEn(c, f) {
  const i = Math.min(c.length - 1, Math.max(0, f * (c.length - 1)));
  const a = c[Math.floor(i)], b = c[Math.ceil(i)], k = i - Math.floor(i);
  return { x: lerp(a.x, b.x, k), y: lerp(a.y, b.y, k), w: lerp(a.w, b.w, k) };
}
function luz(ctx, x, y, rad, color, alfa) {
  const g = ctx.createRadialGradient(x, y, 0, x, y, rad);
  g.addColorStop(0, `rgba(${color},${alfa})`); g.addColorStop(1, `rgba(${color},0)`);
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, rad, 0, Math.PI * 2); ctx.fill();
}
/** Chispeo de granos alrededor de un punto: la señal también es luz granulada. */
function chispas(ctx, x, y, dispersion, n, alfa) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, d = Math.abs((Math.random() + Math.random() - 1)) * dispersion;
    ctx.fillStyle = `rgba(${Math.random() < .5 ? BLANCO : DESTELLO},${alfa * Math.random()})`;
    ctx.beginPath(); ctx.arc(x + Math.cos(a) * d, y + Math.sin(a) * d, .4 + Math.random() * .9, 0, Math.PI * 2); ctx.fill();
  }
}
/** Recorre el tramo detrás de la señal y lo hace brillar con granos. */
function estela(ctx, camino, f, largo) {
  const n = camino.length - 1, fin = Math.floor(f * n);
  for (let i = Math.max(1, fin - largo); i <= fin; i++) {
    const k = 1 - (fin - i) / largo, p = camino[i];
    chispas(ctx, p.x, p.y, p.w + 1.5, 3, .5 * k * k);
  }
}

function cuadro(ahora) {
  const t = ((pausa ? tPausa : ahora) - t0) / 1000;
  const dt = Math.min(.05, Math.max(0, t - previo)); previo = t;
  const { A, B, caminoB, sinapsis, particulas } = escena;
  const ctx = limpiar(lienzos.fx); aplicar(ctx);
  ctx.globalCompositeOperation = 'lighter';

  luz(ctx, A.cx, A.cy, A.tam * 3, AURORA, .07 + .04 * Math.sin(t * .8));
  luz(ctx, B.cx, B.cy, B.tam * 3, AURORA, .06 + .04 * Math.sin(t * .6 + 1));

  const c = t % CICLO;
  if (c < T_A) {
    const f = c / T_A, e = f * f * (3 - 2 * f), p = puntoEn(A.camino, e);
    estela(ctx, A.camino, e, 40);
    luz(ctx, p.x, p.y, 30, AURORA, .3); chispas(ctx, p.x, p.y, 7, 26, .9);
  } else if (c < T_A + T_SALTO) {
    const f = (c - T_A) / T_SALTO;
    luz(ctx, sinapsis.x, sinapsis.y, 20 + 80 * f, AURORA, .45 * Math.sin(f * Math.PI));
    chispas(ctx, sinapsis.x, sinapsis.y, 6 + 30 * f, 60, .9 * (1 - f * .6));
  } else if (c < T_A + T_SALTO + T_B) {
    const f = (c - T_A - T_SALTO) / T_B, e = f * f * (3 - 2 * f), p = puntoEn(caminoB, e);
    estela(ctx, caminoB, e, 36);
    luz(ctx, p.x, p.y, 26, AURORA, .26); chispas(ctx, p.x, p.y, 6, 22, .85);
  } else {
    const f = (c - T_A - T_SALTO - T_B) / (CICLO - T_A - T_SALTO - T_B);
    luz(ctx, B.cx, B.cy, B.tam * (2 + 3 * f), DESTELLO, .28 * (1 - f));
    chispas(ctx, B.cx, B.cy, B.tam * (1 + 2 * f), 30, .6 * (1 - f));
  }
  // La sinapsis titila apenas: la chispa del logo.
  chispas(ctx, sinapsis.x, sinapsis.y, 5, 6, .5);
  luz(ctx, sinapsis.x, sinapsis.y, 14, AURORA, .12 + .06 * Math.sin(t * 1.7));

  // Partículas con movimiento browniano; desenfocadas según su plano.
  const foco = enfoque(t);
  for (const p of particulas) {
    if (!pausa && !reducido) {
      p.vx = p.vx * .9 + (Math.random() - .5) * 16 * dt;
      p.vy = p.vy * .9 + (Math.random() - .5) * 16 * dt - .5 * dt;
      p.x = (p.x + p.vx + VW) % VW; p.y = (p.y + p.vy + VH) % VH;
    }
    const des = Math.abs(p.prof - foco);
    luz(ctx, p.x, p.y, p.rad * (1.4 + des * 5), DESTELLO, .22 * (1 - des * .7));
  }

  if (!reducido) {
    const dx = Math.sin(t * .04) * 18, dy = Math.cos(t * .033) * 12, s = 1 + Math.sin(t * .025) * .012;
    $('lejos').style.transform = `translate(${dx * .4}px,${dy * .4}px) scale(${s})`;
    $('medio').style.transform = `translate(${dx}px,${dy}px) scale(${s})`;
    $('fxCapa').style.transform = `translate(${dx}px,${dy}px) scale(${s})`;
    $('cerca').style.transform = `translate(${dx * 2}px,${dy * 2}px) scale(${s * 1.02})`;
    // Todo un poco difuso; el foco se pasea despacio entre planos.
    $('lejos').style.filter = `blur(${(3 + foco * 6).toFixed(2)}px)`;
    $('medio').style.filter = `blur(${(.8 + Math.abs(foco - .45) * 2).toFixed(2)}px)`;
    $('cerca').style.filter = `blur(${(10 + (1 - foco) * 14).toFixed(2)}px)`;
  }
  $('grano').style.transform = `translate(${(Math.random() * 100 - 50) | 0}px,${(Math.random() * 100 - 50) | 0}px)`;
  if (!pausa) requestAnimationFrame(cuadro);
}
const enfoque = (t) => .45 + .3 * Math.sin(t * .09) * Math.sin(t * .031 + 1);

(() => { // grano de película
  const c = document.createElement('canvas'); c.width = c.height = 220;
  const x = c.getContext('2d'), img = x.createImageData(220, 220);
  for (let i = 0; i < img.data.length; i += 4) { const v = Math.random() * 255;
    img.data[i] = img.data[i + 1] = img.data[i + 2] = v; img.data[i + 3] = 255; }
  x.putImageData(img, 0, 0); $('grano').style.backgroundImage = `url(${c.toDataURL()})`;
})();

$('btnTexto').onclick = (e) => {
  const o = $('texto').classList.toggle('oculto'); e.target.textContent = o ? 'Mostrar texto' : 'Ocultar texto';
};
$('btnPausa').onclick = (e) => {
  pausa = !pausa;
  if (pausa) { tPausa = performance.now(); e.target.textContent = 'Seguir'; }
  else { t0 += performance.now() - tPausa; e.target.textContent = 'Pausar'; requestAnimationFrame(cuadro); }
};
let espera; addEventListener('resize', () => { clearTimeout(espera); espera = setTimeout(preparar, 200); });
preparar();
requestAnimationFrame(cuadro);
</script>
