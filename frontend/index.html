      <h1>Dendra</h1>
      <p>Red de celulares que ubica teléfonos robados o perdidos por internet, SMS o Bluetooth.</p>
      <p>Si el celular se pierde, la recompensa queda bloqueada en un escrow de Trustless Work sobre Stellar (testnet, USDC). Quien lo encuentra la reclama en /r/:id con una billetera Pollar y cobra cuando el dueño confirma la devolución.</p>
      <p>APK de Android: /dendra.apk · Estado del servidor: /api/salud · Código: github.com/ManuelRuaEchalar/wovra-nexo</p>
    </noscript>
